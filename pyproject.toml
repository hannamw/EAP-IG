[project]
name = "eap"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michael Hanna", email = "mh2parker@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.1",
    "transformer-lens>=3.5.1",
]

[project.optional-dependencies]
viz = ["pygraphviz>=1.14"]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".pytest_cache", "__pycache__", "_tmp"]
markers = [
    "integration: tests that load real external model implementations",
    "model_audit_smoke: fast model-audit smoke tests",
    "model_audit_certification: slower model-audit certification tests",
    "model_audit_math: mathematical validation tests for model-audit coverage",
    "slow: intentionally slower validation tests",
]
